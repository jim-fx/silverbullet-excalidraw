name: excalidraw
assets:
  - "dist/**/*.*"
functions:
  excalidrawSlashCommand:
    path: ./src/main.ts:snippetSlashComplete
    events:
      - slash:complete
  ExcalidrawWidget:
    path: ./src/main.ts:widget
    codeWidget: excalidraw
  ExcalidrawEditor:
    path: ./src/main.ts:editor
    editor: ["excalidraw"]
  createDiagram:
    path: ./src/main.ts:createDiagram
    command:
      name: "Excalidraw: Create diagram"
      requireMode: rw
